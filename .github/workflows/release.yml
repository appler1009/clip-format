name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (must match project.yml)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    # The Tart VM runner on the maintainer's Mac mini; set the repository variable CI_RUNS_ON to
    # '"macos-latest"' (with the quotes) to release from a GitHub-hosted runner instead.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","tart"]') }}
    timeout-minutes: 45
    # The `secrets` context is not available in a step-level `if`, so the one
    # value the conditional needs is hoisted to the job environment.
    env:
      CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          project_version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)
          if [ "$version" != "$project_version" ]; then
            echo "::error::tag v$version does not match MARKETING_VERSION $project_version in project.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # GitHub-hosted images ship Homebrew; the Tart image does not, so fall back to the release binary.
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            if command -v brew >/dev/null; then
              brew install xcodegen
            else
              DIR="$RUNNER_TEMP/xcodegen"
              mkdir -p "$DIR"
              curl -fsSL --retry 5 -o "$DIR/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
              unzip -q "$DIR/xcodegen.zip" -d "$DIR"
              echo "$DIR/xcodegen/bin" >> "$GITHUB_PATH"
            fi
          fi
          export PATH="$RUNNER_TEMP/xcodegen/xcodegen/bin:$PATH"
          xcodegen --version

      - name: Test shared core
        working-directory: Shared/ClipFormatShared
        run: swift test

      # Signing is optional so the workflow still produces artifacts before a
      # Developer ID certificate exists. Set the secrets to get a notarized,
      # Gatekeeper-clean build.
      - name: Import signing certificate
        if: env.CERTIFICATE_P12 != ''
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Build, notarize and package
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: Scripts/package.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"

      # Manual runs are dry runs: keep what was built so it can be inspected without publishing.
      - name: Upload the build (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 7

      - name: Extract release notes
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          # The section for this version, up to the next "## " heading.
          awk -v v="## $version" '
            $0 ~ "^"v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "ClipFormat $version" > release-notes.md
          fi

      # GitHub-hosted images include the GitHub CLI; the Tart image does not. Download the official build
      # when it is missing.
      - name: Make sure the GitHub CLI is available
        run: |
          if ! command -v gh >/dev/null; then
            TAG="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"(v[^"]+)".*/\1/')"
            DIR="$RUNNER_TEMP/gh"
            mkdir -p "$DIR"
            curl -fsSL -o "$DIR/gh.zip" "https://github.com/cli/cli/releases/download/$TAG/gh_${TAG#v}_macOS_arm64.zip"
            unzip -q "$DIR/gh.zip" -d "$DIR"
            echo "$DIR/gh_${TAG#v}_macOS_arm64/bin" >> "$GITHUB_PATH"
          fi
          gh --version | sed -n 1p

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "ClipFormat ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            dist/ClipFormat-${{ steps.version.outputs.version }}.dmg \
            dist/ClipFormat-${{ steps.version.outputs.version }}.zip \
            dist/SHA256SUMS.txt
